services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: cloudmart
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d cloudmart"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
